<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visor anatómico</title>
<meta name="theme-color" content="#252525">
<link rel="manifest" href="site.webmanifest">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  color-scheme: dark;
  --bg0:#090e13; --bg1:#111b24; --bg2:#172431;
  --panel:#0e151d; --panel-solid:#0f1820;
  --line:rgba(170,195,210,.13); --line2:rgba(170,195,210,.24);
  --tx:#e8eef1; --mut:#b3c0c8; --dim:#b3c0c8;
  --caution:#FFB800; --warning:#FF3B3B;
  --acc:#f2c46d; --acc-ink:#1b1406;
  --serif:"Newsreader", "Iowan Old Style", Georgia, serif;
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
html,body{height:100%}
body{margin:0;background:var(--bg0);color:var(--tx);font:14px/1.45 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;background:radial-gradient(ellipse 70% 80% at 50% 42%, #1a2835 0%, #0f1820 45%, var(--bg0) 100%)}
#stage canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* ---------- barra superior */
.top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 0;display:flex;gap:12px;align-items:flex-start;pointer-events:none;z-index:5}
.views{margin-left:auto;display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}
.chipbtn{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:12px;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:border-color .15s,background .15s;white-space:nowrap}
.chipbtn:hover{border-color:var(--line2);background:var(--bg2)}
.chipbtn[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.filter-toggle{pointer-events:auto;display:grid;place-items:center;width:36px;height:36px;padding:0}
.filter-toggle svg{width:18px;height:18px}
.filter-toggle[aria-expanded="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}

/* ---------- paneles */
.panel{position:fixed;top:92px;bottom:16px;width:330px;background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;flex-direction:column;z-index:4;overflow:hidden}
.panel:not(.show){display:none}
#left{left:16px}
#right{top:320px;right:16px;width:360px}
#telemetry{top:92px;right:16px;bottom:auto;width:min(540px,calc(100vw - 366px));height:auto;box-sizing:border-box;padding:10px;gap:8px;background:transparent;border:0;border-radius:0;backdrop-filter:none;-webkit-backdrop-filter:none;overflow:visible}
.telemetry-header{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:20px}
.telemetry-title{display:flex;align-items:center;gap:6px;color:var(--mut);font:600 10px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.telemetry-title svg{width:14px;height:14px;color:#00d66b;flex:none}
.telemetry-subject{color:var(--acc);font:500 10px var(--mono);text-align:right;white-space:nowrap}
.telemetry-section{display:flex;flex-direction:column;gap:5px;min-height:0}
.telemetry-section h3{margin:0;color:var(--mut);font:600 10px/1.2 var(--sans);letter-spacing:.03em;text-transform:uppercase}
.telemetry-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.telemetry-card{display:flex;min-width:0;box-sizing:border-box;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 9px;background:#090e13;border:1px solid #293541;border-radius:8px;text-align:center}
.telemetry-label{width:100%;color:var(--mut);font:9.5px/1.2 var(--sans);text-align:center}
.telemetry-value{display:flex;align-items:baseline;justify-content:center;gap:4px;color:var(--tx);font:600 21px/1.1 var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.telemetry-value.stale{color:var(--caution)}
.telemetry-value.unavailable{color:var(--mut)}
.telemetry-unit{color:var(--mut);font:10px var(--mono)}
.telemetry-note{width:100%;color:var(--mut);font:8px/1.2 var(--mono);overflow-wrap:anywhere;text-align:center}
.telemetry-note.stale{color:var(--caution)}
.telemetry-card--heart-rate{overflow:hidden}
.ecg-window{width:100%;height:24px;overflow:hidden;background:repeating-linear-gradient(90deg,rgba(111,231,255,.07) 0 1px,transparent 1px 12px);border-radius:3px}
.ecg-track{display:flex;width:200%;height:100%;animation:ecg-scroll var(--ecg-duration,.86s) linear infinite}
.ecg-track svg{display:block;flex:0 0 50%;width:50%;height:100%}
.ecg-wave{fill:none;stroke:#6fe7ff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
@keyframes ecg-scroll{to{transform:translateX(-50%)}}
#telemetry-vitals{grid-template-columns:repeat(5,minmax(0,1fr))}
.phead{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.eyebrow{font:500 10.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.pbody{overflow:auto;flex:1;padding:6px 8px 14px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}

.search{position:relative}
.search input{width:100%;box-sizing:border-box;background:var(--bg1);border:1px solid var(--line);border-radius:8px;color:var(--tx);padding:8px 10px 8px 30px;font:inherit;font-size:13px}
.search input::placeholder{color:var(--dim)}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);opacity:.6}
#results{display:flex;flex-direction:column;gap:1px;padding:4px 0}
#results[hidden]{display:none}

.peel{display:grid;grid-template-columns:repeat(4,1fr);background:var(--bg1);border:1px solid var(--line);border-radius:8px;padding:3px;gap:3px}
.peel button{background:none;border:0;border-radius:6px;padding:6px 2px;font-size:11.5px;color:var(--mut);cursor:pointer;line-height:1.15}
.peel button:hover{color:var(--tx)}
.peel button[aria-pressed="true"]{background:var(--bg2);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line2)}

.sys{border-radius:9px;margin:2px 0}
.sysrow{display:grid;grid-template-columns:18px 1fr auto 28px;align-items:center;gap:8px;padding:7px 6px 4px 8px}
.sw{width:12px;height:12px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.sysname{background:none;border:0;text-align:left;padding:0;cursor:pointer;font-weight:500;font-size:13.5px;display:flex;gap:6px;align-items:center}
.sysname .chev{transition:transform .15s;opacity:.55}
.sys.open .sysname .chev{transform:rotate(90deg)}
.count{font:11px var(--mono);color:var(--dim);font-variant-numeric:tabular-nums}
.eye{width:28px;height:24px;border:0;background:none;border-radius:6px;cursor:pointer;display:grid;place-items:center;color:var(--mut)}
.eye:hover{background:var(--bg2);color:var(--tx)}
.eye[aria-pressed="false"]{color:var(--dim)}
.oprow{display:flex;align-items:center;gap:8px;padding:0 8px 8px 34px}
.oprow label{font-size:11px;color:var(--dim);width:52px}
.oprow output{font:11px var(--mono);color:var(--mut);width:40px;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:18px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:linear-gradient(90deg,var(--c,#aaa) var(--p,100%),var(--line2) var(--p,100%))}
input[type=range]::-moz-range-track{height:3px;border-radius:3px;background:linear-gradient(90deg,var(--c,#aaa) var(--p,100%),var(--line2) var(--p,100%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--tx);margin-top:-4.5px;border:0}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--tx);border:0}
.sys.off .sysname,.sys.off .count{color:var(--dim)}
.groups{padding:0 4px 6px 30px;display:none}
.sys.open .groups{display:block}
.grp{margin:1px 0}
.grow{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:4px 6px;border-radius:6px}
.grow:hover{background:rgba(255,255,255,.03)}
.grow input{accent-color:var(--acc);margin:0}
.grow button{background:none;border:0;text-align:left;padding:0;cursor:pointer;font-size:12.5px;color:var(--mut)}
.grow button:hover{color:var(--tx)}
.plist{padding:2px 0 6px 22px;display:none}
.grp.open .plist{display:block}
.pitem{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;text-align:left;padding:4px 8px;border-radius:6px;font-size:12.5px;color:var(--mut);cursor:pointer}
.pitem:hover{background:var(--bg2);color:var(--tx)}
.pitem.sel{background:rgba(242,196,109,.12);color:var(--acc)}
.pitem .dot{width:7px;height:7px;border-radius:50%;flex:none}
.pitem .sd{margin-left:auto;font:10.5px var(--mono);color:var(--dim)}
.pitem.hid{color:var(--mut);text-decoration:line-through}

/* ---------- tripulación activa */
#crew{position:fixed;top:92px;bottom:16px;left:16px;width:310px;box-sizing:border-box;z-index:4;display:flex;flex-direction:column}
#crew[hidden]{display:none}
.crew-head{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;font-size:12px;font-weight:600;letter-spacing:.04em}
.crew-head svg{width:15px;height:15px;color:#8dcfff;flex:none}
.crew-head .select-hint{margin-left:auto;font:10px var(--mono);color:var(--mut);font-weight:400}
.crew-list{display:grid;grid-template-rows:repeat(5,minmax(0,1fr));flex:1;min-height:0;gap:8px}
.crew-card{--state:var(--caution);--state-bg:rgba(255,184,0,.12);display:flex;flex-direction:column;justify-content:space-between;box-sizing:border-box;height:100%;width:100%;padding:8px 10px 7px;background:#090e13;border:1px solid #293541;border-radius:9px;color:var(--tx);text-align:left;cursor:pointer;transition:border-color .15s,background .15s,box-shadow .15s}
.crew-card[data-status="normal"]{--state:#00d66b;--state-bg:rgba(0,214,107,.12)}
.crew-card[data-status="warning"]{--state:var(--warning);--state-bg:rgba(255,59,59,.14)}
.crew-card[data-status="caution"]{--state:var(--caution);--state-bg:rgba(255,184,0,.12)}
.crew-card:hover{border-color:var(--line2);background:#101820}
.crew-card[aria-pressed="true"]{background:#1b2b3d;border:2px solid #27c8ff;padding:6px 8px 5px;box-shadow:0 0 0 1px rgba(39,200,255,.08)}
.crew-card:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.crew-top{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:8px}
.crew-avatar{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--state);border-radius:50%;background:var(--state-bg);color:var(--tx);font:500 12px var(--mono)}
.crew-person{min-width:0}
.crew-name{display:block;font-size:12px;font-weight:600;line-height:1.2}
.crew-activity{display:block;margin-top:2px;color:#c5d0d8;font-size:10.5px;line-height:1.2}
.crew-active{padding:2px 5px;border-radius:4px;background:#27c8ff;color:#06131b;font:600 8px/1.2 var(--mono);white-space:nowrap}
.crew-active[hidden]{display:none}
.crew-status{display:flex;align-items:center;gap:4px;margin:5px 0 6px;color:var(--tx);font-size:10px;font-weight:600}
.crew-status svg{width:12px;height:12px;flex:none;color:var(--state)}
.crew-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);padding-top:5px}
.crew-metric-label{display:block;color:var(--mut);font:8px var(--mono);letter-spacing:.02em}
.crew-metric-value{display:block;max-width:100%;margin-top:1px;overflow:hidden;color:#f2f5f7;font:600 10px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.crew-metric-value.stale{color:var(--caution)}

/* ---------- ficha */
#info{padding:18px 18px 20px;display:flex;flex-direction:column;gap:14px}
#info h2{margin:0;font:500 27px/1.12 var(--serif);letter-spacing:-.01em;text-wrap:balance}
dl.facts{margin:0;display:grid;grid-template-columns:1fr;gap:0;border-top:1px solid var(--line)}
dl.facts div{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
dl.facts dt{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding-top:2px}
dl.facts dd{margin:0;font-size:13px;color:var(--tx)}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.btn{background:var(--bg1);border:1px solid var(--line);border-radius:8px;padding:8px 6px;font-size:12.5px;cursor:pointer;display:flex;gap:6px;align-items:center;justify-content:center}
.btn:hover{border-color:var(--line2);background:var(--bg2)}
.btn.primary{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:500}
.empty h2{font:500 24px/1.15 var(--serif)!important}
.howto{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.howto li{display:grid;grid-template-columns:22px 1fr;gap:8px;color:#cfd9de;font-size:13px}
.howto kbd{font:11px var(--mono);background:var(--bg2);border:1px solid var(--line2);border-radius:4px;padding:0 4px;color:var(--tx)}
/* ---------- evaluación guiada de cefalea */
.triage{display:flex;flex-direction:column;gap:11px;padding:14px}
.triage-head{display:flex;flex-direction:column;gap:5px}
.triage h2{margin:0;font:500 21px/1.12 var(--serif);letter-spacing:-.01em}
.triage p{margin:0;color:var(--mut);font-size:12px}
.triage .triage-disclaimer{padding:8px 9px;border:1px solid rgba(242,196,109,.25);border-radius:7px;background:rgba(242,196,109,.07);font-size:10px}
.triage-step{color:var(--acc);font:500 9px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase}
.triage-regions{display:grid;gap:7px}
.triage-region,.triage-answer,.triage-action,.triage-check,.triage-nav button{background:var(--bg1);border:1px solid var(--line);border-radius:8px;color:var(--tx);cursor:pointer}
.triage-region{padding:9px 10px;text-align:left;display:grid;gap:3px}
.triage-region:hover,.triage-answer:hover,.triage-nav button:hover{border-color:var(--acc)}
.triage-region strong{font-size:12px}
.triage-region small{font-size:10px;color:var(--mut)}
.triage-region span{font:9px var(--mono);color:var(--acc)}
.triage-progress{height:3px;overflow:hidden;border-radius:4px;background:var(--line)}
.triage-progress i{display:block;height:100%;background:#00d66b;transition:width .2s}
.triage-count{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--mut);font:10px var(--mono)}
.triage-count strong{color:var(--caution);font-weight:500}
.triage-question{display:grid;align-content:center;gap:8px;min-height:84px;text-align:center}
.triage-question p{color:var(--tx);font-size:14px;font-weight:500}
.triage-answers{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.triage-answer{padding:10px 6px;font-size:12px;font-weight:600}
.triage-answer[data-answer="yes"]{border-color:rgba(255,59,59,.35)}
.triage-answer[data-answer="no"]{border-color:rgba(0,214,107,.3)}
.triage-note{font-size:10px!important;text-align:center}
.triage-nav{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:8px}
.triage-nav button,.triage-action{padding:7px 9px;font-size:11px}
.triage-alert{padding:10px;border:1px solid rgba(255,59,59,.45);border-radius:8px;background:rgba(255,59,59,.09)}
.triage-alert h2{color:#ff8c82;font:600 14px/1.25 var(--sans)}
.triage-checklist{display:grid;gap:5px}
.triage-check{display:flex;align-items:center;gap:8px;padding:8px;text-align:left;font-size:11px}
.triage-check[aria-pressed="true"]{border-color:#ff8c82;background:rgba(255,59,59,.1);text-decoration:line-through;color:var(--mut)}
.triage-done{padding:10px;border:1px solid rgba(0,214,107,.3);border-radius:8px;background:rgba(0,214,107,.07)}
.triage-summary{display:grid;gap:5px;margin:0;padding:0;list-style:none}
.triage-summary li{font-size:10px;color:var(--mut);border-bottom:1px solid var(--line);padding:5px 0}
.triage-summary strong{color:var(--tx)}
/* ---------- etiqueta 3D y tooltip */
#labelLayer{position:fixed;inset:0;pointer-events:none;z-index:3}
#labelLayer svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#label{position:absolute;left:0;top:0;transform:translate(-9999px,0);background:#0a0f14;border:1px solid var(--acc);border-radius:8px;padding:7px 11px 8px;max-width:260px}
#label .ln{font:500 16px/1.2 var(--serif);color:var(--tx)}
#label .ls{font-size:11px;color:var(--acc);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
#tip{position:fixed;left:0;top:0;z-index:6;pointer-events:none;background:#0a0f14;border:1px solid var(--line2);border-radius:6px;padding:4px 8px;font-size:12px;white-space:nowrap;transform:translate(-9999px,0)}
#tip i{font-style:normal;color:var(--dim);margin-left:6px}

/* ---------- carga */
#loader{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:7;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-width:280px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:opacity .5s}
#loader.done{opacity:0;pointer-events:none}
#loader .lt{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-bottom:8px}
#loader .bar{height:3px;background:var(--line);border-radius:3px;overflow:hidden}
#loader .bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
#err{color:#ff9b8a;font-size:12px;margin-top:8px}

/* ---------- móvil */
.tabs{display:none}
@media (max-width: 900px){
  .top{flex-direction:column;gap:8px}
  .views{margin-left:0;max-width:100%;flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;scrollbar-width:none;padding-bottom:2px}
  .views::-webkit-scrollbar{display:none}
  .views .chipbtn{padding:5px 10px;font-size:11.5px}
  .panel{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 56px);left:10px!important;right:10px!important;width:auto!important;max-height:44vh;border-radius:14px}
  #right{top:auto}
  #telemetry{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 56px);left:10px!important;right:10px!important;width:auto!important;height:auto;max-height:55vh;padding:8px;gap:7px;overflow-y:auto}
  #telemetry-vitals{grid-template-columns:repeat(3,minmax(0,1fr))}
  .telemetry-header{min-height:18px;padding-bottom:4px}
  .telemetry-title{font-size:9px}
  .telemetry-title svg{width:12px;height:12px}
  .telemetry-subject{font-size:9px}
  .telemetry-grid{gap:5px}
  .telemetry-card{gap:3px;padding:7px 6px}
  .telemetry-label{font-size:9px}
  .telemetry-value{font-size:18px}
  .telemetry-unit{font-size:9px}
  .telemetry-note{font-size:7.5px}
  .ecg-window{height:21px}
  #crew{top:calc(env(safe-area-inset-top,0px) + 78px);bottom:calc(env(safe-area-inset-bottom,0px) + 56px);left:10px;width:calc(100% - 20px)}
  .crew-list{gap:4px}
  .crew-card{padding:3px 7px 2px}
  .crew-card[aria-pressed="true"]{padding:2px 6px 1px}
  .crew-top{grid-template-columns:28px minmax(0,1fr) auto;gap:6px}
  .crew-avatar{width:26px;height:26px;font-size:10px}
  .crew-activity{margin-top:1px;font-size:8px;line-height:1.1;white-space:nowrap}
  .crew-status{margin:2px 0 3px;font-size:9px}
  .crew-status svg{width:11px;height:11px}
  .crew-metrics{padding-top:2px}
  .crew-metric{display:flex;align-items:baseline;gap:3px;white-space:nowrap}
  .crew-metric-label{font-size:7px}
  .crew-metric-value{font-size:9px}
  .tabs{display:flex;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:6;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;gap:3px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .tabs button{background:none;border:0;border-radius:999px;padding:7px 16px;font-size:13px;color:var(--mut);cursor:pointer}
  .tabs button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink)}
  #loader{bottom:70px;min-width:0;width:calc(100% - 52px)}
}
@media (max-height: 600px){
  #crew{top:calc(env(safe-area-inset-top,0px) + 56px);bottom:calc(env(safe-area-inset-bottom,0px) + 56px)}
  .crew-head{padding:4px 6px;font-size:10px}
  .crew-head svg{width:12px;height:12px}
  .crew-list{gap:3px}
  .crew-card{padding:2px 6px 1px}
  .crew-card[aria-pressed="true"]{padding:1px 5px 0}
  .crew-top{grid-template-columns:23px minmax(0,1fr) auto;gap:5px}
  .crew-avatar{width:21px;height:21px;font-size:8px}
  .crew-name{font-size:10px}
  .crew-activity{margin-top:1px;font-size:8px;line-height:1.1;white-space:nowrap}
  .crew-active{padding:1px 3px;font-size:7px}
  .crew-status{gap:3px;margin:1px 0 2px;font-size:8px}
  .crew-status svg{width:9px;height:9px}
  .crew-metrics{padding-top:1px}
  .crew-metric{gap:2px}
  .crew-metric-label{font-size:7px}
  .crew-metric-value{font-size:9px}
}
@media (min-height: 601px) and (max-height: 700px) and (min-width: 901px){
  #crew{top:78px}
  .crew-list{gap:4px}
  .crew-card{padding:4px 8px 3px}
  .crew-card[aria-pressed="true"]{padding:3px 7px 2px}
  .crew-top{grid-template-columns:28px minmax(0,1fr) auto;gap:6px}
  .crew-avatar{width:26px;height:26px;font-size:10px}
  .crew-activity{margin-top:1px;font-size:8px;line-height:1.1;white-space:nowrap}
  .crew-status{margin:2px 0 3px;font-size:9px}
  .crew-status svg{width:11px;height:11px}
  .crew-metrics{padding-top:2px}
  .crew-metric{display:flex;align-items:baseline;gap:3px;white-space:nowrap}
  .crew-metric-label{font-size:7px}
  .crew-metric-value{font-size:9px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}.ecg-track{animation:none}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="labelLayer"><svg aria-hidden="true"><line id="lline" x1="0" y1="0" x2="0" y2="0" stroke="#f2c46d" stroke-width="1.2"/><circle id="ldot" r="4" fill="#f2c46d" stroke="#0a0f14" stroke-width="2" cx="-99" cy="-99"/></svg><div id="label"><div class="ln"></div><div class="ls"></div></div></div>
<div id="tip"></div>

<header class="top">
  <button id="filters-toggle" class="chipbtn filter-toggle" type="button" aria-label="Mostrar filtros" aria-expanded="false" title="Mostrar filtros" data-i18n-attr="aria-label:showFilters;title:showFilters"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v2.2m0 14.6v2.2M2.5 12h2.2m14.6 0h2.2M5.28 5.28l1.56 1.56m10.32 10.32 1.56 1.56m0-13.44-1.56 1.56M6.84 17.16l-1.56 1.56"/></svg></button>
  <nav class="views" aria-label="Vistas" data-i18n-attr="aria-label:views">
    <button class="chipbtn" data-view="front" data-i18n="front">Anterior</button>
    <button class="chipbtn" data-view="back" data-i18n="back">Posterior</button>
    <button class="chipbtn" data-view="right" data-i18n="right">Lateral dcho.</button>
    <button class="chipbtn" data-view="left" data-i18n="left">Lateral izq.</button>
    <button class="chipbtn" data-view="top" data-i18n="top">Superior</button>
    <button class="chipbtn" id="spin" aria-pressed="false" data-i18n="spin">Girar</button>
    <button class="chipbtn" id="reset" data-i18n="reset">Restablecer</button>
    <button class="chipbtn" id="lang" aria-label="Idioma" data-i18n-attr="aria-label:langLabel"></button>
  </nav>
</header>

<aside id="crew" aria-label="Tripulación activa" data-i18n-attr="aria-label:crewTitle">
  <div class="crew-head">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.3"/><path d="M5.5 20v-1.6a6.5 6.5 0 0 1 13 0V20"/></svg>
    <span data-i18n="crewTitle">Tripulación</span>
    <span class="select-hint" data-i18n="crewSelectHint">ELEGIR</span>
  </div>
  <div class="crew-list" id="crew-list" role="group" aria-label="Seleccionar tripulante" data-i18n-attr="aria-label:crewSelect"></div>
</aside>

<aside class="panel" id="left" aria-label="Capas y sistemas" data-i18n-attr="aria-label:panelLayers">
  <div class="phead">
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar estructura (p. ej. «fémur», «hígado»)" autocomplete="off" aria-label="Buscar estructura" data-i18n-attr="placeholder:searchPh;aria-label:search">
    </div>
    <div>
      <div class="eyebrow" style="margin-bottom:7px" data-i18n="peel">Pelar capas</div>
      <div class="peel" role="group" aria-label="Pelar capas" data-i18n-attr="aria-label:peel">
        <button data-peel="0" aria-pressed="true" data-i18n="peelAll">Todo</button>
        <button data-peel="1" aria-pressed="false" data-i18n="peelSkin">Sin piel</button>
        <button data-peel="2" aria-pressed="false" data-i18n="peelMuscle">Sin músculo</button>
        <button data-peel="3" aria-pressed="false" data-i18n="peelViscera">Vísceras</button>
      </div>
    </div>
  </div>
  <div class="pbody">
    <div id="results" hidden></div>
    <div id="systems"></div>
  </div>
</aside>

<aside class="panel" id="telemetry" aria-label="Telemetría continua" data-i18n-attr="aria-label:telemetryTitle">
  <div class="telemetry-header">
    <div class="telemetry-title">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 4.5v3.8l2.4 1.4"/></svg>
      <span data-i18n="telemetryTitle">Telemetría continua</span>
    </div>
    <span class="telemetry-subject" id="telemetry-subject" aria-live="polite"></span>
  </div>
  <section class="telemetry-section" aria-labelledby="telemetry-vitals-title">
    <h3 id="telemetry-vitals-title" data-i18n="biometricsHeading">Signos vitales · Bio-monitor</h3>
    <div class="telemetry-grid" id="telemetry-vitals"></div>
  </section>
</aside>

<!-- Ficha anatómica temporalmente deshabilitada; se conserva para poder reactivarla.
<aside class="panel" id="right" aria-label="Ficha de la estructura" data-i18n-attr="aria-label:panelCard">
  <div class="pbody" style="padding:0"><div id="info"></div></div>
</aside>
-->

<aside class="panel" id="right" aria-label="Evaluación guiada" data-i18n-attr="aria-label:panelCard">
  <div class="pbody" style="padding:0"><div id="triage" aria-live="polite"></div></div>
</aside>

<div class="tabs" role="group" aria-label="Paneles" data-i18n-attr="aria-label:tabs">
  <button data-tab="none" aria-pressed="true" data-i18n="tabModel">Modelo</button>
  <button data-tab="telemetry" aria-pressed="false" data-i18n="tabTelemetry">Signos</button>
  <button data-tab="right" aria-pressed="false" data-i18n="tabCard">Ficha</button>
</div>

<div id="loader"><div class="lt"><span id="ltxt" data-i18n="loading">Cargando modelo anatómico…</span><span id="lpct">0 %</span></div><div class="bar"><i id="lbar"></i></div><div id="err" hidden></div></div>
<script src="data/anatomia.js"></script>
<script src="models/esq.js"></script>
<script src="models/mus.js"></script>
<script src="models/ner.js"></script>
<script src="models/dig.js"></script>
<script src="models/car.js"></script>
<script src="models/end.js"></script>
<script src="models/uri.js"></script>
<script src="models/rep.js"></script>
<script src="models/res.js"></script>
<script src="models/teg.js"></script>
<script src="models/lin.js"></script>
<script src="app.js"></script>
</body>
</html>
